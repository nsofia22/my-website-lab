<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Сторінка реєстрації користувача у вебсистемі «Твоя бібліотека фільмів»">
  <meta name="author" content="MyMovieLibrary Team">
  <meta name="keywords" content="Фільми, бібліотека, реєстрація, кіно, перегляд">
  <meta property="og:title" content="Твоя бібліотека фільмів">
  <meta property="og:description" content="Створи власну колекцію переглянутих фільмів.">
  <meta property="og:type" content="website">
  <title>Твоя бібліотека фільмів. Реєстрація</title>

  <!-- Шрифти -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #a75bff;
      --background-color: #4b3a63;
      --text-color: #fff;
      --input-bg: rgba(255, 255, 255, 0.1);
      --input-border: rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      background-color: var(--background-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 2rem;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.7s ease-in-out;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 1.8rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s, background-color 0.3s;
    }

    input:focus {
      border-color: var(--primary-color);
      background-color: rgba(255, 255, 255, 0.15);
    }

    input:required {
      border-left: 3px solid var(--primary-color);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      font-weight: bold;
      padding: 0.9rem;
      border-radius: 10px;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background: #8d43e5;
      transform: translateY(-2px);
    }

    #message {
      margin-top: 1rem;
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    footer {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 1.5rem;
    }

    @media (max-width: 600px) {
      .overlay {
        width: 95%;
        padding: 1.5rem;
      }
      h1 { font-size: 1.5rem; }
      input, .btn-primary { font-size: 1rem; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <div class="overlay">
      <h1>Твоя бібліотека фільмів</h1>
<h2>Вітання! Ласкаво просимо до твоєї бібліотеки фільмів</h2>
<p class="subtitle">Зареєструйся, щоб створити власну колекцію улюблених фільмів</p>

<form id="registrationForm" novalidate autocomplete="off">
  <input type="text" id="name" name="name" placeholder="Ім’я*" required inputmode="text">
  <input type="text" id="surname" name="surname" placeholder="Прізвище" inputmode="text">
  <input type="text" id="username" name="username" placeholder="Нікнейм" inputmode="text">
  <input type="email" id="email" name="email" placeholder="Електронна адреса*" required inputmode="email">
  <input type="password" id="password" name="password" placeholder="Пароль*" required inputmode="text">
  <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
  <div id="message"></div>
</form>

      <footer>© 2025 MyMovieLibrary</footer>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById('registrationForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();

      if (!name || !email || !password) {
        showMessage('Заповніть усі обов’язкові поля.', '#ff8080');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('Введіть коректну електронну адресу.', '#ff8080');
        return;
      }

      if (password.length < 6) {
        showMessage('Пароль має містити не менше 6 символів.', '#ff8080');
        return;
      }

      showMessage('Реєстрація успішна!', '#80ff9f');
      form.reset();
    });

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
      message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  </script>
</body>
</html>
